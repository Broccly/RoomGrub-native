appId: com.roomgrub.app
# Assumes a logged-in session (run login.yaml first, or rely on Maestro's
# state persistence between flows in the same `maestro test` invocation).
---
- launchApp:
    clearState: false
# Launch reopens the last room; step back to the rooms list underneath it.
- runFlow:
    when:
      notVisible: "Your Rooms"
    commands:
      - back
- assertVisible: "Your Rooms"
- tapOn: "New Room"
- assertVisible:
    text: "RoomGrub"
    timeout: 10000

- tapOn:
    id: "tab-add"
    optional: true
- tapOn:
    text: "Add"
    optional: true

- tapOn:
    id: "amount-input-ADD EXPENSE"
- inputText: "50"
- tapOn: "What was it for?"
- inputText: "Milk"
- tapOn: "Add ₹50"
- assertVisible: "Added ₹50 · Milk"
- back

- tapOn: "Expenses"
- assertVisible: "Milk"
- assertVisible: "₹50"
