appId: com.roomgrub.app
# Assumes a logged-in session (run login.yaml first, or rely on Maestro's
# state persistence between flows in the same `maestro test` invocation).
---
- launchApp:
    clearState: false
# Launch either reopens the last room (rooms list underneath) or lands on the
# rooms list, which shows only a spinner while it loads. Wait for one of them,
# then step back only if we're inside a room: `back` on the rooms list exits.
- extendedWaitUntil:
    visible: "Your Rooms|Home"
    timeout: 15000
- runFlow:
    when:
      visible: "Home" # the room's bottom tab; never on the rooms list
    commands:
      - back
- assertVisible: "Your Rooms"
- tapOn: "New Room"
- assertVisible:
    text: "RoomGrub"
    timeout: 10000

- tapOn:
    id: "tab-add"
    optional: true
- tapOn:
    text: "Add"
    optional: true

- tapOn:
    id: "amount-input-ADD EXPENSE"
- inputText: "50"
- tapOn: "What was it for?"
- inputText: "Milk"
- tapOn: "Add ₹50"
- assertVisible: "Added ₹50 · Milk"
- back

- tapOn: "Expenses"
- assertVisible: "Milk"
- assertVisible: "₹50"
