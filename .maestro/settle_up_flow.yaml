appId: com.roomgrub.app
# Requires a room with at least one unsettled expense between two members
# (see create_room_and_add_expense.yaml + invite_and_join_member.yaml).
---
- launchApp:
    clearState: false
- assertVisible: "RoomGrub"
- tapOn: "Splits"
- assertVisible: "Settle All"
- tapOn:
    text: "Settle All.*"
- assertVisible: "Settle"
- tapOn: "Settle"
- assertVisible:
    text: "All Clear!"
    timeout: 10000

# Relaunch and confirm the settled state persisted server-side.
- launchApp:
    clearState: false
- tapOn: "Splits"
- assertVisible:
    text: "All Clear!"
    timeout: 10000
